<!-- Homepage layout and navigation compatibility fix -->
<style>
/* Neutralize legacy negative anchor offsets, including the more specific #about-me rule. */
.page__content #about-me::before,
.page__content .anchor::before,
.page__content h1[id]::before {
  content: none;
  display: none;
  height: 0;
  margin: 0;
}
.page__content #about-me,
.page__content .anchor {
  margin: 0;
  height: 0;
  scroll-margin-top: var(--anchor-offset, 110px);
}
.page__content h1[id] {
  scroll-margin-top: var(--anchor-offset, 110px);
}
</style>
<script>
/* Same-page navigation: account for the floating header instead of the legacy -20px offset. */
(function () {
  'use strict';
  function init() {
    var header = document.querySelector('.masthead');
    if (!header) return;
    // Homepage opens the root URL; About Me keeps its own section anchor.
    var homeLink = document.querySelector('.masthead__menu-home-item a');
    if (homeLink) homeLink.setAttribute('href', location.pathname + location.search);
    var initialCancelled = false;
    function gap() {
      var stickyTop = parseFloat(getComputedStyle(header).top) || 0;
      return Math.ceil(header.getBoundingClientRect().height + stickyTop + 16);
    }
    function updateGap() {
      document.documentElement.style.setProperty('--anchor-offset', gap() + 'px');
    }
    function resolve(hash) {
      var id;
      try { id = decodeURIComponent(hash.slice(1)); } catch (_) { return null; }
      var element = document.getElementById(id);
      if (!element) return null;
      if (element.classList.contains('anchor')) {
        element = document.getElementById(id === 'about-me' ? 'about-title' : '-' + id) || element;
      }
      return element;
    }
    function go(hash, smooth) {
      var element = hash ? resolve(hash) : null;
      if (hash && !element) return;
      updateGap();
      if (window.jQuery) window.jQuery('html, body').stop(true);
      var top = element ?
        Math.max(0, window.scrollY + element.getBoundingClientRect().top - gap()) : 0;
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({top: top, behavior: smooth && !reduceMotion ? 'smooth' : 'auto'});
    }
    // Capture first: the old jQuery handler would otherwise override scroll-margin-top.
    document.addEventListener('click', function (event) {
      var link = event.target.closest && event.target.closest('a[href]');
      if (!link || event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
      var explicitTarget = link.getAttribute('target');
      if (explicitTarget && explicitTarget !== '_self') return;
      var isHomepage = !!link.closest('.masthead__menu-home-item');
      var url = new URL(link.href, location.href);
      if (url.origin !== location.origin || url.pathname !== location.pathname ||
          url.search !== location.search || (!url.hash && !isHomepage)) return;
      var element = resolve(url.hash);
      if (!isHomepage && (!element || !element.closest('.page__content'))) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      initialCancelled = true;
      if (location.hash !== url.hash) {
        try { history.pushState(null, '', url.pathname + url.search + url.hash); } catch (_) {}
      }
      go(url.hash, true);
    }, true);
    window.addEventListener('hashchange', function () { go(location.hash, false); });
    ['wheel', 'touchstart', 'keydown', 'pointerdown'].forEach(function (name) {
      window.addEventListener(name, function () { initialCancelled = true; }, {passive: true, once: true});
    });
    function alignInitialHash() {
      if (!initialCancelled && location.hash) go(location.hash, false);
    }
    updateGap();
    window.addEventListener('resize', updateGap);
    if (window.ResizeObserver) new ResizeObserver(updateGap).observe(header);
    requestAnimationFrame(alignInitialHash);
    if (document.readyState !== 'complete') window.addEventListener('load', alignInitialHash, {once: true});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, {once: true});
  else init();
})();
</script>

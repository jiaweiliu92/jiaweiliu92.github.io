name: Get Citation Data

on:
  # Run after a GitHub Pages build, including homepage/content updates.
  page_build:
  # Daily update at 08:00 UTC.
  schedule:
    - cron: '0 8 * * *'
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    # Keep the full-publication crawl bounded while leaving time to publish JSON.
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r google_scholar_crawler/requirements.txt

      - name: Retrieve full Google Scholar profile
        working-directory: google_scholar_crawler
        timeout-minutes: 30
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: python -u main.py

      - name: Publish citation data
        working-directory: google_scholar_crawler/results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s gs_data.json
          test -s gs_data_shieldsio.json

          git init
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json
          git commit -m "Updated Citation Data"

          remote_repo="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "${remote_repo}" HEAD:google-scholar-stats --force
